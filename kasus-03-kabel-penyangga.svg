<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="330mm" viewBox="0 0 816 1247">
    <defs>
      <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233B"/><stop offset="1" stop-color="#244B7A"/></linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
    </defs>
    <rect width="816" height="1247" fill="#FFFFFF"/>
    <rect x="26" y="26" width="764" height="1195" rx="22" fill="none" stroke="#D9E2EF" stroke-width="2"/>
    <rect x="42" y="42" width="732" height="214" rx="18" fill="url(#head)"/>
    <rect x="42" y="42" width="10" height="214" rx="5" fill="#F2B84B"/>
    <text x="76" y="88" fill="#BFD6F5" font-size="17" font-weight="700" letter-spacing="2" font-family="Arial, sans-serif">STUDI KASUS 03 • SINUS &amp; KOSINUS</text>
    <text x="76" y="145" fill="#FFFFFF" font-size="36" font-weight="800" font-family="Arial, sans-serif">Menguatkan tiang jaringan sekolah</text>
    <text x="76" y="184" fill="#E3EEFC" font-size="19" font-family="Arial, sans-serif">Gunakan panjang kabel dan sudut terhadap tanah untuk menentukan kebutuhan.</text>
    <rect x="76" y="210" width="126" height="7" rx="3.5" fill="url(#accent)"/>
    <rect x="640" y="66" width="98" height="42" rx="21" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".35"/>
    <text x="689" y="93" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="Arial, sans-serif">F4 • 3/3</text>
    <text x="58" y="1200" fill="#64748B" font-size="13" font-family="Arial, sans-serif">MPI TRIGONOMETRI • LITERASI NUMERASI KELAS X</text>
    <text x="758" y="1200" text-anchor="end" fill="#64748B" font-size="13" font-family="Arial, sans-serif">IDA YUNIAR TRYASTUTI, S.Pd.</text>
    <rect x="58" y="277" width="700" height="76" rx="12" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.5"/><text x="78" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">NAMA:</text><line x1="139" y1="310" x2="400" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="425" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">KELAS:</text><line x1="490" y1="310" x2="565" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="590" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">TANGGAL:</text><line x1="670" y1="310" x2="735" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="78" y="337" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Tuliskan jawaban ringkas di sini; rincian perhitungan dapat dilanjutkan di buku.</text><rect x="58" y="375" width="700" height="145" rx="15" fill="#F8FBFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="392" width="165" height="34" rx="9" fill="#2563EB"/><text x="90" y="415" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">SITUASI</text><text x="78" y="451" font-size="17" fill="#1F2937" font-weight="400" font-family="Arial, sans-serif"><tspan x="78" dy="0">Teknisi memasang kabel penyangga dari puncak tiang jaringan menuju pasak</tspan><tspan x="78" dy="26">di tanah. Panjang satu kabel 15 m dan sudut kabel terhadap permukaan tanah</tspan><tspan x="78" dy="26">adalah 52°. Terdapat tiga kabel identik yang akan dipasang.</tspan></text><rect x="58" y="538" width="700" height="279" rx="15" fill="#F6FAFE" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="555" width="265" height="34" rx="9" fill="#0EA5A4"/><text x="90" y="578" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">MODEL KABEL PENYANGGA</text><line x1="130" y1="762" x2="690" y2="762" stroke="#64748B" stroke-width="3"/><rect x="563" y="602" width="18" height="160" rx="4" fill="#2563EB"/><line x1="145" y1="762" x2="572" y2="602" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/><circle cx="145" cy="762" r="7" fill="#F59E0B"/><circle cx="572" cy="602" r="6" fill="#2563EB"/><path d="M195 762 A50 50 0 0 0 192 744" fill="none" stroke="#0EA5A4" stroke-width="3"/><text x="219" y="746" font-size="18" fill="#0EA5A4" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">52°</text><text x="347" y="654" font-size="17" fill="#B45309" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Kabel 15 m</text><text x="594" y="641" font-size="14" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Titik ikat</text><text x="594" y="661" font-size="14" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">pada tiang</text><text x="357" y="790" font-size="15" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Jarak pasak dari kaki tiang</text><text x="569" y="785" font-size="14" fill="#2563EB" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Tiang</text><text x="145" y="785" font-size="14" fill="#0EA5A4" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Pasak</text><rect x="58" y="834" width="700" height="128" rx="15" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="850" width="160" height="34" rx="9" fill="#2563EB"/><text x="90" y="873" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">DATA PEKERJAAN</text><rect x="78" y="893" width="196" height="52" rx="10" fill="#F3F7FC" stroke="#D9E2EF" stroke-width="1.5"/><rect x="291" y="893" width="196" height="52" rx="10" fill="#F3F7FC" stroke="#D9E2EF" stroke-width="1.5"/><rect x="504" y="893" width="230" height="52" rx="10" fill="#F3F7FC" stroke="#D9E2EF" stroke-width="1.5"/><text x="176" y="914" font-size="13" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Panjang kabel</text><text x="176" y="936" font-size="19" fill="#14233B" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">15 m</text><text x="389" y="914" font-size="13" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Sudut terhadap tanah</text><text x="389" y="936" font-size="19" fill="#14233B" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">52°</text><text x="619" y="914" font-size="13" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Jumlah kabel</text><text x="619" y="936" font-size="19" fill="#14233B" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3 buah</text><rect x="58" y="982" width="700" height="34" rx="9" fill="#14233B"/><text x="72" y="1005" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">TANTANGAN NUMERASI • HITUNG, TAFSIRKAN, DAN RENCANAKAN</text><circle cx="76" cy="1025" r="14" fill="#E8F0FF"/><text x="76" y="1030" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">1</text><text x="102" y="1030" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Pilih rasio untuk menentukan tinggi titik ikat dari kabel 15 m dan sudut 52°.</text><line x1="102" y1="1053" x2="728" y2="1053" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1069" r="14" fill="#E8F0FF"/><text x="76" y="1074" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">2</text><text x="102" y="1074" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung tinggi titik ikat dari tanah. Bulatkan ke 0,01 m.</text><line x1="102" y1="1097" x2="728" y2="1097" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1113" r="14" fill="#E8F0FF"/><text x="76" y="1118" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">3</text><text x="102" y="1118" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung jarak mendatar dari kaki tiang ke pasak. Bulatkan ke 0,01 m.</text><line x1="102" y1="1141" x2="728" y2="1141" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1157" r="14" fill="#E8F0FF"/><text x="76" y="1162" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">4</text><text x="102" y="1162" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Tiga kabel dipasang dengan cadangan 8%. Berapa total kabel minimal yang disiapkan?</text><line x1="102" y1="1185" x2="728" y2="1185" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/></svg>