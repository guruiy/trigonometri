<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="330mm" viewBox="0 0 816 1247">
    <defs>
      <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233B"/><stop offset="1" stop-color="#244B7A"/></linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
    </defs>
    <rect width="816" height="1247" fill="#FFFFFF"/>
    <rect x="26" y="26" width="764" height="1195" rx="22" fill="none" stroke="#D9E2EF" stroke-width="2"/>
    <rect x="42" y="42" width="732" height="214" rx="18" fill="url(#head)"/>
    <rect x="42" y="42" width="10" height="214" rx="5" fill="#F2B84B"/>
    <text x="76" y="88" fill="#BFD6F5" font-size="17" font-weight="700" letter-spacing="2" font-family="Arial, sans-serif">STUDI KASUS 01 • SUDUT ELEVASI</text>
    <text x="76" y="145" fill="#FFFFFF" font-size="36" font-weight="800" font-family="Arial, sans-serif">Seberapa tinggi tiang bendera?</text>
    <text x="76" y="184" fill="#E3EEFC" font-size="19" font-family="Arial, sans-serif">Gunakan sudut elevasi dan jarak untuk memperkirakan tinggi objek.</text>
    <rect x="76" y="210" width="126" height="7" rx="3.5" fill="url(#accent)"/>
    <rect x="640" y="66" width="98" height="42" rx="21" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".35"/>
    <text x="689" y="93" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="Arial, sans-serif">F4 • 1/3</text>
    <text x="58" y="1200" fill="#64748B" font-size="13" font-family="Arial, sans-serif">MPI TRIGONOMETRI • LITERASI NUMERASI KELAS X</text>
    <text x="758" y="1200" text-anchor="end" fill="#64748B" font-size="13" font-family="Arial, sans-serif">IDA YUNIAR TRYASTUTI, S.Pd.</text>
    <rect x="58" y="277" width="700" height="76" rx="12" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.5"/><text x="78" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">NAMA:</text><line x1="139" y1="310" x2="400" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="425" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">KELAS:</text><line x1="490" y1="310" x2="565" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="590" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">TANGGAL:</text><line x1="670" y1="310" x2="735" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="78" y="337" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Tuliskan jawaban ringkas di sini; rincian perhitungan dapat dilanjutkan di buku.</text><rect x="58" y="375" width="700" height="147" rx="15" fill="#F8FBFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="392" width="165" height="34" rx="9" fill="#2563EB"/><text x="90" y="415" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">SITUASI</text><text x="78" y="451" font-size="17" fill="#1F2937" font-weight="400" font-family="Arial, sans-serif"><tspan x="78" dy="0">Tim numerasi mengukur tinggi tiang bendera sekolah tanpa memanjatnya.</tspan><tspan x="78" dy="26">Pengamat berdiri pada jarak mendatar 12 m dari kaki tiang. Sudut elevasi</tspan><tspan x="78" dy="26">dari tinggi mata pengamat ke puncak tiang adalah 38°. Tinggi mata 1,5 m.</tspan></text><rect x="58" y="540" width="700" height="264" rx="15" fill="#F6FAFE" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="557" width="200" height="34" rx="9" fill="#0EA5A4"/><text x="90" y="580" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">MODEL PENGUKURAN</text><line x1="105" y1="755" x2="690" y2="755" stroke="#64748B" stroke-width="3"/><rect x="594" y="600" width="22" height="155" rx="4" fill="#2563EB"/><path d="M605 600 L605 575 L625 586 L605 597" fill="#F2B84B" stroke="#C98B14" stroke-width="1.5"/><circle cx="605" cy="575" r="4" fill="#F2B84B"/><circle cx="154" cy="710" r="10" fill="#0EA5A4"/><path d="M154 720 L154 751 M154 729 L139 742 M154 729 L169 742" stroke="#0EA5A4" stroke-width="6" stroke-linecap="round"/><line x1="164" y1="710" x2="605" y2="600" stroke="#F59E0B" stroke-width="3" stroke-dasharray="9 7"/><line x1="164" y1="755" x2="605" y2="755" stroke="#64748B" stroke-width="2"/><line x1="164" y1="710" x2="164" y2="755" stroke="#0EA5A4" stroke-width="2" stroke-dasharray="4 4"/><path d="M205 710 A42 42 0 0 0 204 700" fill="none" stroke="#F59E0B" stroke-width="2.5"/><text x="224" y="695" font-size="18" fill="#B45309" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">38°</text><text x="382" y="778" font-size="16" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">12 m (jarak mendatar)</text><text x="628" y="640" font-size="15" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Puncak</text><text x="628" y="661" font-size="15" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">tiang</text><text x="117" y="684" font-size="14" fill="#0EA5A4" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Mata</text><text x="117" y="702" font-size="14" fill="#0EA5A4" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">1,5 m</text><text x="606" y="788" font-size="14" fill="#64748B" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Kaki tiang</text><rect x="58" y="822" width="700" height="156" rx="15" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="839" width="210" height="34" rx="9" fill="#2563EB"/><text x="90" y="862" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">DATA PENGAMATAN</text><line x1="78" y1="883" x2="78" y2="940" stroke="#D9E2EF" stroke-width="1.4"/><line x1="258" y1="883" x2="258" y2="940" stroke="#D9E2EF" stroke-width="1.4"/><line x1="468" y1="883" x2="468" y2="940" stroke="#D9E2EF" stroke-width="1.4"/><line x1="728" y1="883" x2="728" y2="940" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="883" x2="728" y2="883" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="911" x2="728" y2="911" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="940" x2="728" y2="940" stroke="#D9E2EF" stroke-width="1.4"/><text x="90" y="903" font-size="14" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Titik</text><text x="270" y="903" font-size="14" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Jarak</text><text x="480" y="903" font-size="14" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Sudut elevasi</text><text x="90" y="930" font-size="16" fill="#1F2937" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">A</text><text x="270" y="930" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">12 m</text><text x="480" y="930" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">38°</text><text x="90" y="959" font-size="16" fill="#1F2937" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">B</text><text x="270" y="959" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">10 m</text><text x="480" y="959" font-size="16" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">43°</text><rect x="58" y="982" width="700" height="34" rx="9" fill="#14233B"/><text x="72" y="1005" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">TANTANGAN NUMERASI • TULISKAN LANGKAH PERHITUNGAN</text><circle cx="76" cy="1025" r="14" fill="#E8F0FF"/><text x="76" y="1030" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">1</text><text x="102" y="1030" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Pilih rasio untuk menghubungkan tinggi relatif, jarak 12 m, dan sudut 38°.</text><line x1="102" y1="1053" x2="728" y2="1053" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1069" r="14" fill="#E8F0FF"/><text x="76" y="1074" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">2</text><text x="102" y="1074" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung selisih tinggi puncak tiang terhadap mata pengamat. Bulatkan ke 0,1 m.</text><line x1="102" y1="1097" x2="728" y2="1097" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1113" r="14" fill="#E8F0FF"/><text x="76" y="1118" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">3</text><text x="102" y="1118" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung tinggi tiang dengan menambahkan tinggi mata pengamat, yaitu 1,5 m.</text><line x1="102" y1="1141" x2="728" y2="1141" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1157" r="14" fill="#E8F0FF"/><text x="76" y="1162" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">4</text><text x="102" y="1162" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Titik B: 10 m dan 43°. Apakah hasilnya mendukung pengukuran A? Jelaskan.</text><line x1="102" y1="1185" x2="728" y2="1185" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/></svg>