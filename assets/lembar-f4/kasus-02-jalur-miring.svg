    <text x="76" y="88" fill="#BFD6F5" font-size="17" font-weight="700" letter-spacing="2" font-family="Arial, sans-serif">STUDI KASUS 02 • KEMIRINGAN</text>
    <text x="76" y="145" fill="#FFFFFF" font-size="36" font-weight="800" font-family="Arial, sans-serif">Rancangan jalur menuju perpustakaan</text>
    <text x="76" y="184" fill="#E3EEFC" font-size="19" font-family="Arial, sans-serif">Gunakan tangen, sudut, dan panjang sisi untuk membandingkan rancangan.</text>
    <rect x="76" y="210" width="126" height="7" rx="3.5" fill="url(#accent)"/>
    <rect x="640" y="66" width="98" height="42" rx="21" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".35"/>
    <text x="689" y="93" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" font-family="Arial, sans-serif">F4 • 2/3</text>
    <text x="58" y="1200" fill="#64748B" font-size="13" font-family="Arial, sans-serif">MPI TRIGONOMETRI • LITERASI NUMERASI KELAS X</text>
    <text x="758" y="1200" text-anchor="end" fill="#64748B" font-size="13" font-family="Arial, sans-serif">IDA YUNIAR TRYASTUTI, S.Pd.</text>
    <rect x="58" y="277" width="700" height="76" rx="12" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.5"/><text x="78" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">NAMA:</text><line x1="139" y1="310" x2="400" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="425" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">KELAS:</text><line x1="490" y1="310" x2="565" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="590" y="307" font-size="15" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">TANGGAL:</text><line x1="670" y1="310" x2="735" y2="310" stroke="#9AAAC0" stroke-width="1.4"/><text x="78" y="337" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Tuliskan jawaban ringkas di sini; rincian perhitungan dapat dilanjutkan di buku.</text><rect x="58" y="375" width="700" height="145" rx="15" fill="#F8FBFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="392" width="165" height="34" rx="9" fill="#2563EB"/><text x="90" y="415" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">SITUASI</text><text x="78" y="451" font-size="17" fill="#1F2937" font-weight="400" font-family="Arial, sans-serif"><tspan x="78" dy="0">Sekolah merancang jalur miring untuk menghubungkan halaman dengan teras</tspan><tspan x="78" dy="26">perpustakaan. Ketinggian teras 0,72 m di atas halaman. Tim membuat dua</tspan><tspan x="78" dy="26">pilihan panjang mendatar: Rancangan A = 6 m dan Rancangan B = 8 m.</tspan></text><rect x="58" y="538" width="700" height="276" rx="15" fill="#F6FAFE" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="555" width="220" height="34" rx="9" fill="#0EA5A4"/><text x="90" y="578" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">DUA RANCANGAN JALUR</text><path d="M112 748 L355 748 L355 675 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><line x1="112" y1="748" x2="355" y2="675" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><line x1="355" y1="748" x2="355" y2="675" stroke="#2563EB" stroke-width="3"/><line x1="112" y1="748" x2="355" y2="748" stroke="#64748B" stroke-width="2.5"/><text x="225" y="776" font-size="16" fill="#2563EB" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">A • 6 m</text><text x="367" y="711" font-size="14" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">0,72 m</text><text x="228" y="644" font-size="20" fill="#2563EB" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">A</text><path d="M432 748 L704 748 L704 675 Z" fill="#CCFBF1" stroke="#0F9D91" stroke-width="3"/><line x1="432" y1="748" x2="704" y2="675" stroke="#0F9D91" stroke-width="5" stroke-linecap="round"/><line x1="704" y1="748" x2="704" y2="675" stroke="#0F9D91" stroke-width="3"/><line x1="432" y1="748" x2="704" y2="748" stroke="#64748B" stroke-width="2.5"/><text x="568" y="776" font-size="16" fill="#0EA5A4" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">B • 8 m</text><text x="715" y="711" font-size="14" fill="#0EA5A4" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">0,72 m</text><text x="568" y="644" font-size="20" fill="#0EA5A4" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">B</text><text x="407" y="800" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle" font-family="Arial, sans-serif">Sketsa tidak dibuat berdasarkan skala.</text><rect x="58" y="832" width="700" height="146" rx="15" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.5"/><rect x="76" y="848" width="205" height="34" rx="9" fill="#2563EB"/><text x="90" y="871" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">DATA RANCANGAN</text><line x1="78" y1="891" x2="78" y2="967" stroke="#D9E2EF" stroke-width="1.4"/><line x1="263" y1="891" x2="263" y2="967" stroke="#D9E2EF" stroke-width="1.4"/><line x1="443" y1="891" x2="443" y2="967" stroke="#D9E2EF" stroke-width="1.4"/><line x1="728" y1="891" x2="728" y2="967" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="891" x2="728" y2="891" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="916" x2="728" y2="916" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="941" x2="728" y2="941" stroke="#D9E2EF" stroke-width="1.4"/><line x1="78" y1="967" x2="728" y2="967" stroke="#D9E2EF" stroke-width="1.4"/><text x="90" y="909" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Pilihan</text><text x="273" y="909" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Naik vertikal</text><text x="450" y="909" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Jarak mendatar</text><text x="90" y="934" font-size="15" fill="#2563EB" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">A</text><text x="273" y="934" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">0,72 m</text><text x="450" y="934" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">6 m</text><text x="90" y="960" font-size="15" fill="#0EA5A4" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">B</text><text x="273" y="960" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">0,72 m</text><text x="450" y="960" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">8 m</text><rect x="58" y="982" width="700" height="34" rx="9" fill="#14233B"/><text x="72" y="1005" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">TANTANGAN NUMERASI • GUNAKAN DATA UNTUK MEMUTUSKAN</text><circle cx="76" cy="1025" r="14" fill="#E8F0FF"/><text x="76" y="1030" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">1</text><text x="102" y="1030" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung persentase kemiringan A: (naik ÷ mendatar) × 100%.</text><line x1="102" y1="1053" x2="728" y2="1053" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1069" r="14" fill="#E8F0FF"/><text x="76" y="1074" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">2</text><text x="102" y="1074" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Pilihan mana lebih landai? Bandingkan kenaikan dengan jarak mendatar.</text><line x1="102" y1="1097" x2="728" y2="1097" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1113" r="14" fill="#E8F0FF"/><text x="76" y="1118" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">3</text><text x="102" y="1118" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Hitung panjang permukaan jalur A menggunakan Teorema Pythagoras.</text><line x1="102" y1="1141" x2="728" y2="1141" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="76" cy="1157" r="14" fill="#E8F0FF"/><text x="76" y="1162" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Arial, sans-serif">4</text><text x="102" y="1162" font-size="13" fill="#1F2937" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Batas jarak mendatar 7 m. Pilihan mana yang muat? Jelaskan komprominya.</text><line x1="102" y1="1185" x2="728" y2="1185" stroke="#D9E2EF" stroke-width="1.5" stroke-dasharray="4 4"/></svg>